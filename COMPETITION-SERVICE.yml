server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/event_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:7f3a9c2e1d8b4a6f9e2c7d5b1a8f3e6c0d4b9a2f7e1c6d8b5a3f9e0c2d7b4a}

# Logical service name of Event Service as registered in Eureka, used for
# service-to-service calls (e.g. validating an eventId before creating a
# competition under it).
services:
  event-service:
    name: EVENT-SERVICE

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

app:
  websocket:
    allowed-origin: ${WEBSOCKET_ALLOWED_ORIGIN:http://localhost:3000}        
