server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/event_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:pass@word1}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:7f3a9c2e1d8b4a6f9e2c7d5b1a8f3e6c0d4b9a2f7e1c6d8b5a3f9e0c2d7b4a}

# Logical service name of Competition Service as registered in Eureka, used
# to look up a round's competition (and its eventId) for EVENT-scope
# coordinator authorization checks.
services:
  competition-service:
    name: COMPETITION-SERVICE

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
        
  endpoint:
    health:
      show-details: always
      
  metrics:
    tags:
      application: ${spring.application.name}

  
